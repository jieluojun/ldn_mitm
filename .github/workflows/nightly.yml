name: Nightly

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      # devkitA64 r29.2 / gcc 15.2.0 (see Makefile).
      image: devkitpro/devkita64:20260219

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          # git describe needs tags and full history.
          fetch-depth: 0

      - name: Trust the workspace for git
        run: git config --global --add safe.directory '*'

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
      
      - name: update Atmosphere-libs
        run: |
          pushd Atmosphere-libs
          git fetch --all
          git reset --hard origin/master
          popd

      - name: Install libnx master (before building)
        run: |
          # 最新 Atmosphere-libs(上一步已顶到 master)使用 pgl 新命名
          # (pglEventObserverGetShellEvent 系,libnx 2026-09-15 a13cd192 起),
          # 安装 libnx master 与其配套,保证无论镜像自带 libnx 版本如何都能编译。
          pushd /tmp
          git clone https://github.com/switchbrew/libnx
          cd libnx
          make -j8 PREFIX="ccache aarch64-none-elf-"
          make install
          popd

      - name: Install switch-curl (订阅 HTTPS 下载)
        run: |
          set -euo pipefail
          # 订阅(chinese_db.json)经 https://v6.gh-proxy.org/ 加速镜像下载,
          # overlay 内置 switch-curl(libnx SSL 后端)走 TLS;确保镜像装了它。
          if dkp-pacman -Q switch-curl >/dev/null 2>&1; then
            echo "switch-curl already installed"
          else
            # DevkitPro package DB refresh can fail with HTTP 403. Do not
            # make a mirror refresh failure fatal if cached DBs can install it.
            if ! dkp-pacman -Sy --noconfirm; then
              echo "::warning::DevkitPro package DB refresh failed; trying cached metadata."
            fi
            dkp-pacman -S --noconfirm --needed switch-curl || true
          fi
          if ! dkp-pacman -Q switch-curl >/dev/null 2>&1; then
            echo "::error::Required package switch-curl is not installed."
            exit 1
          fi

      - name: Build
        id: build
        run: make -j8 PREFIX="ccache aarch64-none-elf-"

      - name: Upload built files
        uses: actions/upload-artifact@v7
        with:
          name: sdcard
          path: out/sd
          # Hidden dirs (switch/.overlays) are skipped by default.
          include-hidden-files: true

      - name: Upload ldn_mitm elf file
        uses: actions/upload-artifact@v7
        with:
          name: ldn_mitm.elf
          path: ldn_mitm/ldn_mitm.elf

      - name: Upload overlay elf file
        uses: actions/upload-artifact@v7
        with:
          name: overlay.elf
          path: overlay/overlay.elf
